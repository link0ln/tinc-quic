# Node1 - Main VLESS+Reality+QUIC Server
Name = node1
Port = 443
DeviceType = tun
Interface = tinc0
Mode = router

# QUIC Transport (NEW!)
TransportMode = quic

# ===== QUIC DPI Evasion Configuration =====
# These settings help hide VPN traffic from Deep Packet Inspection (DPI)

# Timing Jitter - Adds random delay to packets to hide timing patterns
# Default: 1000 (1ms), Range: 0 (disabled) to 50000 (50ms)
# Recommended values:
#   0     - Disabled (lowest latency, minimal DPI evasion)
#   1000  - Default (1ms, balanced performance/security)
#   2000  - Moderate (2ms, good DPI evasion)
#   5000  - Strong (5ms, maximum DPI evasion, higher latency)
QUICJitterMaxUs = 0

# SNI Domain Pool - Customize domains for DPI evasion
# Default: 12 popular CDN/cloud domains (cloudflare, google, microsoft, etc.)
# You can specify custom domains for your region:
# QUICSNIDomains = www.cloudflare.com, cdn.jsdelivr.net, api.github.com
#
# Node1 Testing: Using DEFAULT pool (no QUICSNIDomains specified)
# This tests fallback to the built-in 12-domain pool

# Connection Multiplexing - Mimic browser behavior with multiple parallel streams
# Default: 6 streams, Range: 1-10
# More streams = better browser imitation, slightly more overhead
QUICStreamCount = 6

# Keepalive Configuration - Periodic packets to maintain connection
# QUICKeepaliveMin/Max: Interval range in seconds (random within range)
# Default: 5-15 seconds, Set to 0 to disable
# QUICKeepaliveSize: Packet size in bytes (16-512)
# Default: 64 bytes
QUICKeepaliveMin = 5
QUICKeepaliveMax = 15
QUICKeepaliveSize = 64

# HTTP/3 Masquerading - Wrap VPN traffic in HTTP/3 frames
# Default: no (disabled), Set to yes to enable
# When enabled, all VPN metadata traffic is wrapped in HTTP/3 DATA frames
# Periodically sends realistic HTTP GET/POST requests (HEADERS frames)
# Mimics browser behavior: User-Agent, Accept headers, common URL paths
# Very effective against Deep Packet Inspection (makes traffic look like web browsing)
# Node1 Testing: ENABLED
QUICHTTP3Masquerading = yes

# Other DPI Evasion Techniques (Automatic):
# - ALPN Obfuscation: Uses "quic" instead of "tinc-vpn-quic"
# - Realistic TLS Certificates: Mimics CDN infrastructure
# - TLS 1.3 Encryption: Native QUIC encryption (bypasses SPTPS)
# - Multiple Stream Priorities: Urgent/High/Medium/Low (like browser)

# VPN Address configuration (auto-configuration)
# This replaces the tinc-up script - interface is configured automatically
VPNAddress = 10.0.0.1/24

# Network settings
PingInterval = 10
PingTimeout = 5
AutoConnect = yes
ConnectTo = node2
ConnectTo = node3
MTU = 1400
QUICPaddingMode = off
QUICDebugLevel = 0

# ===== DPI Evasion: Real TLS Certificate =====
# Use Let's Encrypt certificate for k1k.ru domain
# This makes the server appear as a legitimate HTTPS website
# instead of exposing O=TincVPN in the certificate
QUICCertFile = /etc/tinc/certs/fullchain.pem
QUICKeyFile = /etc/tinc/certs/privkey.pem

# Trust public certificates (Let's Encrypt) for DPI evasion
# Allows connecting to servers using real domain certificates
QUICTrustPublicCerts = yes

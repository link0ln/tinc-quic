# Node3 - VLESS+Reality+QUIC Client
Name = node3
Port = 443
DeviceType = tun
Interface = tinc0
Mode = router

# Connect to node1
# DISABLED to prevent simultaneous connections (node1 initiates all connections)
# ConnectTo = node1

# QUIC Transport (NEW!)
TransportMode = quic

# ===== QUIC DPI Evasion Configuration =====
# These settings help hide VPN traffic from Deep Packet Inspection (DPI)

# Timing Jitter - Adds random delay to packets to hide timing patterns
# Default: 1000 (1ms), Range: 0 (disabled) to 50000 (50ms)
# Recommended values:
#   0     - Disabled (lowest latency, minimal DPI evasion)
#   1000  - Default (1ms, balanced performance/security)
#   2000  - Moderate (2ms, good DPI evasion)
#   5000  - Strong (5ms, maximum DPI evasion, higher latency)
QUICJitterMaxUs = 0

# SNI Domain Pool - Customize domains for DPI evasion
# Node3 Testing: Extended 6-domain pool (more variety)
# Mix of global CDNs and popular services
QUICSNIDomains = www.google.com, fonts.googleapis.com, www.youtube.com, raw.githubusercontent.com, www.amazon.com, s3.amazonaws.com

# Connection Multiplexing - Node3 Testing: Extended configuration
# Using more streams for maximum browser imitation
QUICStreamCount = 8

# Keepalive Configuration - Node3 Testing: Extended intervals and larger packets
# Longer intervals (10-20 sec) with bigger packets (128 bytes)
QUICKeepaliveMin = 10
QUICKeepaliveMax = 20
QUICKeepaliveSize = 128

# HTTP/3 Masquerading - Wrap VPN traffic in HTTP/3 frames
# Default: no (disabled), Set to yes to enable
# When enabled, all VPN metadata traffic is wrapped in HTTP/3 DATA frames
# Periodically sends realistic HTTP GET/POST requests (HEADERS frames)
# Mimics browser behavior: User-Agent, Accept headers, common URL paths
# Very effective against Deep Packet Inspection (makes traffic look like web browsing)
# Node3 Testing: ENABLED (for compatibility with node1)
QUICHTTP3Masquerading = yes

# Other DPI Evasion Techniques (Automatic):
# - ALPN Obfuscation: Uses "quic" instead of "tinc-vpn-quic"
# - Realistic TLS Certificates: Mimics CDN infrastructure
# - TLS 1.3 Encryption: Native QUIC encryption (bypasses SPTPS)
# - Multiple Stream Priorities: Urgent/High/Medium/Low (like browser)

# VPN Address configuration (auto-configuration)
# This replaces the tinc-up script - interface is configured automatically
VPNAddress = 10.0.0.3/24

# Network settings
PingInterval = 10
PingTimeout = 5
AutoConnect = no
MTU = 1400
QUICPaddingMode = off
QUICDebugLevel = 0

# Trust public certificates (Let's Encrypt) for DPI evasion
# Allows connecting to servers using real domain certificates
QUICTrustPublicCerts = yes

# Node5 - Fresh join test node
Name = node5
Port = 443
DeviceType = tun
Interface = tinc0
Mode = router

# QUIC Transport
TransportMode = quic

# Connection settings
ConnectTo = node1
AutoConnect = yes
PingInterval = 10
PingTimeout = 5
MTU = 1400

# QUIC DPI Evasion
QUICJitterMaxUs = 0
QUICStreamCount = 6
QUICKeepaliveMin = 5
QUICKeepaliveMax = 15
QUICKeepaliveSize = 64
QUICHTTP3Masquerading = yes
QUICPaddingMode = off
QUICDebugLevel = 0

# Trust public certificates (Let's Encrypt) for DPI evasion
# Required for initial 'join' before CA is received from inviter
QUICTrustPublicCerts = yes
